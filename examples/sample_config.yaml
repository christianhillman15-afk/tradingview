# Sample configuration for the AI futures bot.
# Run with:  python -m ai_futures_bot.cli backtest --config examples/sample_config.yaml --serve

symbol: ES                 # E-mini S&P 500 (see `list-contracts` for more)
strategy: donchian_trend   # see `list-strategies`
starting_cash: 50000       # $50,000 paper account
commission_per_contract: 2.50
slippage_ticks: 1.0
state_path: runtime/state.json

# Strategy-specific parameters (override any constructor argument).
strategy_params:
  entry_period: 20
  exit_period: 10
  atr_stop_mult: 2.0

# Risk management — the professional rules: small per-trade risk, daily-loss
# kill switch, and a global drawdown halt.
risk:
  risk_per_trade: 0.01        # risk 1% of equity per trade
  max_contracts: 20
  max_margin_fraction: 0.50
  daily_loss_limit: 0.03      # stop trading for the day past a 3% loss
  max_drawdown_stop: 0.20     # halt entirely past a 20% drawdown
  scale_by_strength: false

# Data source: "synthetic" (no network needed) or "csv".
data:
  source: synthetic
  days: 90
  bars_per_day: 390
  seed: 42
  start_price: 5000.0
  annual_drift: 0.05
  annual_vol: 0.20
  # For real data instead:
  # source: csv
  # csv_path: data/es_1min.csv

dashboard:
  host: 127.0.0.1
  port: 8000
