[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-futures-bot"
version = "0.1.0"
description = "Modular, research-grounded framework for backtesting and paper-trading futures (ES/MES etc.) with a live dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ml = ["numpy>=1.24", "scikit-learn>=1.3"]
ib = ["ib_insync>=0.9.86"]
dev = ["pytest>=7.0"]

[project.scripts]
ai-futures-bot = "ai_futures_bot.cli:main"

[tool.setuptools.packages.find]
include = ["ai_futures_bot*"]

[tool.setuptools.package-data]
"ai_futures_bot.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
